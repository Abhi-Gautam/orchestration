# Isolated stack for this repository only.
# Compose project name: orchestration
#
# Starts Temporal + the only worker + the product web UI.
# Does not use default Temporal ports (7233 / 8080).
name: orchestration

services:
  postgresql:
    image: postgres:14
    container_name: orchestration-postgresql
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    networks:
      - orchestration

  temporal:
    image: temporalio/auto-setup:1.29.2
    container_name: orchestration-temporal
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgresql
    ports:
      - "7234:7233"
    networks:
      - orchestration

  temporal-ui:
    image: temporalio/ui:2.44.1
    container_name: orchestration-temporal-ui
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8234:8080"
    networks:
      - orchestration

  rustfs-permissions:
    image: alpine:3.22
    container_name: orchestration-rustfs-permissions
    user: root
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    volumes:
      - rustfs-data:/data
    networks:
      - orchestration

  rustfs:
    image: rustfs/rustfs:latest
    container_name: orchestration-rustfs
    command: ["/data"]
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    volumes:
      - rustfs-data:/data
    networks:
      - orchestration

  # The only Temporal worker process for this lab.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        COMMAND: worker
    image: orchestration-worker:local
    command: ["-c", ".air.worker.toml"]
    container_name: orchestration-worker
    depends_on:
      temporal:
        condition: service_started
      rustfs:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE}
      TASK_QUEUE: ${TASK_QUEUE}
      RUSTFS_ENDPOINT_URL: http://rustfs:9000
      RUSTFS_REGION: us-east-1
      RUSTFS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_ARTIFACT_BUCKET: reusable-activity-artifacts
      APPLICATION_DB_PATH: /data/application/reports.db
    restart: unless-stopped
    volumes:
      - .:/src
      - worker-air-tmp:/src/tmp
      - application-data:/data/application
    networks:
      - orchestration

  # Product web UI + Temporal client (does not run a worker).
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        COMMAND: web
    image: orchestration-web:local
    command: ["-c", ".air.web.toml"]
    container_name: orchestration-web
    depends_on:
      temporal:
        condition: service_started
      worker:
        condition: service_started
    environment:
      WEB_ADDRESS: ${WEB_ADDRESS}
      TEMPORAL_ADDRESS: temporal:7233
      # Browser-facing Temporal UI link (host port published by temporal-ui).
      TEMPORAL_UI_ADDRESS: ${TEMPORAL_UI_ADDRESS}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE}
      TASK_QUEUE: ${TASK_QUEUE}
    ports:
      - "8090:8090"
    restart: unless-stopped
    volumes:
      - .:/src
      - web-air-tmp:/src/tmp
    networks:
      - orchestration

networks:
  orchestration:
    name: orchestration-network

volumes:
  temporal-postgres-data:
    name: orchestration-temporal-postgres-data
  rustfs-data:
    name: orchestration-rustfs-data
  application-data:
    name: orchestration-application-data
  web-air-tmp:
  worker-air-tmp:
