root = "."
tmp_dir = "tmp"

[build]
  entrypoint = ["./tmp/web"]
  cmd = "go build -o ./tmp/web ./cmd/web"
  delay = 500
  exclude_dir = ["tmp", "vendor", "docs", ".git", ".agents"]
  exclude_regex = ["_test\\.go"]
  include_ext = ["go", "html", "css", "js", "toml"]
  include_dir = ["cmd/web", "internal", "gen"]
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
