syntax = "proto3";

package orchestration.v1;

option go_package = "orchestration/gen/orchestration/v1;orchestrationv1";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

enum OperationState {
  OPERATION_STATE_UNSPECIFIED = 0;
  OPERATION_STATE_RUNNING = 1;
  OPERATION_STATE_SUCCEEDED = 2;
  OPERATION_STATE_FAILED = 3;
  OPERATION_STATE_CANCELED = 4;
}

enum OperationAction {
  OPERATION_ACTION_UNSPECIFIED = 0;
  OPERATION_ACTION_CANCEL = 1;
}

message OperationProgress {
  int64 planned = 1;
  int64 scheduled = 2;
  int64 in_flight = 3;
  int64 succeeded = 4;
  int64 failed = 5;
  int64 canceled = 6;
  int64 not_started = 7;
  double percent = 8;
}

message OperationStatus {
  OperationState state = 1;
  string phase = 2;
  string current_step = 3;
  string message = 4;
  int64 revision = 5;
  OperationProgress progress = 6;
  repeated OperationAction available_actions = 7;
}

message GreetingRequest {
  string name = 1;
}

message GreetingResult {
  string greeting = 1;
}

message WaitResult {
  string name = 1;
  int32 attempt = 2;
  google.protobuf.Timestamp started_at = 3;
  google.protobuf.Timestamp finished_at = 4;
  google.protobuf.Duration elapsed = 5;
}

message SimpleDiamondRequest {
  google.protobuf.Duration prepare_duration = 1;
  google.protobuf.Duration branch_a_duration = 2;
  google.protobuf.Duration branch_b_duration = 3;
  google.protobuf.Duration finalize_duration = 4;
}

message SimpleDiamondResult {
  google.protobuf.Timestamp started_at = 1;
  google.protobuf.Timestamp finished_at = 2;
  google.protobuf.Duration elapsed = 3;
  repeated WaitResult nodes = 4;
}

message DynamicFanOutRequest {
  int32 requested_count = 1;
  google.protobuf.Duration branch_duration = 2;
  google.protobuf.Duration finalize_duration = 3;
}

message DynamicFanOutResult {
  int32 planned_count = 1;
  int32 completed_count = 2;
  google.protobuf.Timestamp started_at = 3;
  google.protobuf.Timestamp finished_at = 4;
  google.protobuf.Duration elapsed = 5;
  google.protobuf.Timestamp first_branch_started_at = 6;
  google.protobuf.Timestamp last_branch_finished_at = 7;
  int32 peak_concurrent_branches = 8;
  WaitResult finalize = 9;
}

enum ReusableArtifactFailureCase {
  REUSABLE_ARTIFACT_FAILURE_CASE_UNSPECIFIED = 0;
  REUSABLE_ARTIFACT_FAILURE_CASE_NONE = 1;
  REUSABLE_ARTIFACT_FAILURE_CASE_BEFORE_PUBLICATION = 2;
  REUSABLE_ARTIFACT_FAILURE_CASE_AFTER_PUBLICATION = 3;
}

message ReusableArtifactRequest {
  string experiment_id = 1;
  string activity_version = 2;
  google.protobuf.Duration heavy_work_duration = 3;
  ReusableArtifactFailureCase failure_case = 4;
  string failure_target_activity = 5;
}

message ArtifactReference {
  string store = 1;
  string object_key = 2;
}

message ReusableArtifactResult {
  repeated ArtifactReference artifacts = 1;
}

enum DurableReportFailureCase {
  DURABLE_REPORT_FAILURE_CASE_UNSPECIFIED = 0;
  DURABLE_REPORT_FAILURE_CASE_NONE = 1;
  DURABLE_REPORT_FAILURE_CASE_AGGREGATION_RETRYABLE = 2;
  DURABLE_REPORT_FAILURE_CASE_PERSIST_BEFORE_COMMIT = 3;
  DURABLE_REPORT_FAILURE_CASE_PERSIST_AFTER_COMMIT = 4;
}

message DurableReportRequest {
  string experiment_id = 1;
  string report_id = 2;
  string activity_version = 3;
  google.protobuf.Duration heavy_work_duration = 4;
  DurableReportFailureCase failure_case = 5;
}

message DurableReportResult {
  string report_id = 1;
  int32 artifact_count = 2;
  string semantic_digest = 3;
}

enum AggregationPolicy {
  AGGREGATION_POLICY_UNSPECIFIED = 0;
  AGGREGATION_POLICY_FAIL_FAST = 1;
  AGGREGATION_POLICY_ALL_SETTLED = 2;
  AGGREGATION_POLICY_ALL_SETTLED_THEN_FAIL = 3;
}

enum FaultMode {
  FAULT_MODE_UNSPECIFIED = 0;
  FAULT_MODE_SUCCESS = 1;
  FAULT_MODE_RETRYABLE_FAILURE = 2;
  FAULT_MODE_NON_RETRYABLE_FAILURE = 3;
  FAULT_MODE_PANIC = 4;
  FAULT_MODE_START_TO_CLOSE_TIMEOUT = 5;
  FAULT_MODE_HEARTBEAT_TIMEOUT = 6;
  FAULT_MODE_WAIT_FOR_CANCELLATION = 7;
}

message OutcomeProbabilities {
  int32 success = 1;
  int32 retryable_failure = 2;
  int32 non_retryable_failure = 3;
  int32 panic = 4;
  int32 start_to_close_timeout = 5;
  int32 heartbeat_timeout = 6;
}

enum FaultCampaignType {
  FAULT_CAMPAIGN_TYPE_UNSPECIFIED = 0;
  FAULT_CAMPAIGN_TYPE_ALL_SUCCESS_V1 = 1;
  FAULT_CAMPAIGN_TYPE_MIXED_V1 = 2;
}

message FaultCampaignSpec {
  FaultCampaignType type = 1;
  int32 activity_count = 2;
  int64 seed = 3;
  OutcomeProbabilities background_probabilities = 4;
}

// A branch declares exactly what it demonstrates. The Workflow resolves campaign
// probabilities into concrete modes before scheduling, so it can give each branch a
// deadline that only the injected fault can breach.
message FaultBranchSpec {
  string name = 1;
  FaultMode mode = 2;
  google.protobuf.Duration work_duration = 3;
  google.protobuf.Duration stall_duration = 4;
  int32 fail_until_attempt = 5;
  reserved 6, 7, 8;
  reserved "seed", "heartbeat_interval", "probabilities";
}

message FanOutPolicyRequest {
  AggregationPolicy policy = 1;
  repeated FaultBranchSpec branches = 2;
  reserved 3;
  reserved "finalize_duration";
  FaultCampaignSpec campaign = 4;
}

enum ActivityFailureKind {
  ACTIVITY_FAILURE_KIND_UNSPECIFIED = 0;
  ACTIVITY_FAILURE_KIND_APPLICATION = 1;
  ACTIVITY_FAILURE_KIND_TIMEOUT = 2;
  ACTIVITY_FAILURE_KIND_CANCELED = 3;
  ACTIVITY_FAILURE_KIND_PANIC = 4;
  ACTIVITY_FAILURE_KIND_UNKNOWN = 5;
}

// Attached to every Activity heartbeat and failure so a Workflow can report which attempt
// produced a terminal outcome. It is one typed value on purpose: the SDK leaves surplus
// decode targets untouched and still reports success, so a positional detail list cannot
// be validated and quietly reports attempt zero when the shapes drift.
message ActivityAttempt {
  string activity_id = 1;
  int32 attempt = 2;
}

message ActivityFailure {
  ActivityFailureKind kind = 1;
  string message = 2;
  string type = 3;
  bool non_retryable = 4;
  string timeout_type = 5;
  int32 final_attempt = 6;
}

message FaultActivityResult {
  string name = 1;
  FaultMode outcome = 2;
  int32 attempt = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp finished_at = 5;
  google.protobuf.Duration elapsed = 6;
}

message ActivityOutcome {
  string activity_id = 1;
  int32 index = 2;
  FaultActivityResult result = 3;
  ActivityFailure failure = 4;
}

message FanOutAggregate {
  bool complete = 1;
  int32 consumed_successful_outputs = 2;
  string semantic_digest = 3;
}

message FanOutFailureBreakdown {
  int32 retry_exhausted = 1;
  int32 non_retryable = 2;
  int32 panic = 3;
  int32 start_to_close_timeout = 4;
  int32 heartbeat_timeout = 5;
  int32 canceled = 6;
  int32 unknown = 7;
}

message FanOutPolicyResult {
  AggregationPolicy policy = 1;
  int32 planned = 2;
  int32 succeeded = 3;
  int32 failed = 4;
  int32 canceled = 5;
  reserved 6, 7;
  reserved "outcomes", "finalize";
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp finished_at = 9;
  google.protobuf.Duration elapsed = 10;
  FaultCampaignType campaign_type = 11;
  int64 seed = 12;
  int32 succeeded_first_attempt = 13;
  int32 succeeded_after_retry = 14;
  FanOutAggregate aggregate = 15;
  FanOutFailureBreakdown failure_breakdown = 16;
  repeated ActivityOutcome samples = 17;
  ActivityOutcome fail_fast_trigger = 18;
}

enum FailureCategory {
  FAILURE_CATEGORY_UNSPECIFIED = 0;
  FAILURE_CATEGORY_VALIDATION = 1;
  FAILURE_CATEGORY_BUSINESS = 2;
  FAILURE_CATEGORY_DEPENDENCY = 3;
  FAILURE_CATEGORY_TIMEOUT = 4;
  FAILURE_CATEGORY_CANCELED = 5;
  FAILURE_CATEGORY_INTERNAL = 6;
}

message WorkflowFailure {
  string code = 1;
  string message = 2;
  FailureCategory category = 3;
  bool retryable = 4;
  map<string, string> metadata = 5;
}

// Training job: a parent Workflow owning shard Workflows that checkpoint independently.
// Cancellation is cooperative and bounded; termination is not, which is the comparison.

enum ShardState {
  SHARD_STATE_UNSPECIFIED = 0;
  // Reached the requested step count.
  SHARD_STATE_COMPLETED = 1;
  // Cancelled, and its in-flight interval finished inside the grace period.
  SHARD_STATE_DRAINED = 2;
  // Cancelled, and the grace period expired before its interval finished.
  SHARD_STATE_ABANDONED = 3;
  SHARD_STATE_FAILED = 4;
}

enum CheckpointFailureCase {
  CHECKPOINT_FAILURE_CASE_UNSPECIFIED = 0;
  CHECKPOINT_FAILURE_CASE_NONE = 1;
  // Publish a checkpoint whose payload does not match its checksum, standing in for a
  // write interrupted partway. Resume must reject it rather than resume from a lie.
  CHECKPOINT_FAILURE_CASE_TORN_WRITE = 2;
}

message TrainingJobRequest {
  string experiment_id = 1;
  int32 shard_count = 2;
  int32 total_steps = 3;
  int32 steps_per_checkpoint = 4;
  google.protobuf.Duration step_duration = 5;
  // How long a cancelled shard may keep working to finish its current interval. Zero
  // abandons the interval immediately; a longer grace preserves more work.
  google.protobuf.Duration shutdown_grace = 6;
  CheckpointFailureCase failure_case = 7;
}

message TrainingShardRequest {
  string experiment_id = 1;
  string shard_id = 2;
  int32 total_steps = 3;
  int32 steps_per_checkpoint = 4;
  google.protobuf.Duration step_duration = 5;
  google.protobuf.Duration shutdown_grace = 6;
  CheckpointFailureCase failure_case = 7;
}

message ShardOutcome {
  string shard_id = 1;
  ShardState state = 2;
  int32 resumed_from_step = 3;
  int32 completed_step = 4;
  int32 checkpoint_step = 5;
  string checkpoint_key = 6;
  int32 rejected_checkpoints = 7;
}

message TrainingJobResult {
  int32 shard_count = 1;
  int32 total_steps = 2;
  // The highest step every shard has a valid checkpoint for. Resuming anywhere above it
  // would advance a shard past work another shard never durably recorded.
  int32 resume_step = 3;
  bool complete = 4;
  int32 resumed_from_step = 5;
  google.protobuf.Duration shutdown_latency = 6;
  repeated ShardOutcome shards = 7;
}

// Conditional branch: CheckInventory at runtime, then FulfillOrder XOR BackorderOrder.
enum OrderPath {
  ORDER_PATH_UNSPECIFIED = 0;
  ORDER_PATH_FULFILL = 1;
  ORDER_PATH_BACKORDER = 2;
}

message ConditionalBranchRequest {
  string order_id = 1;
  string sku = 2;
  int32 quantity = 3;
  // Lab fixture: stock level CheckInventory observes. Production would load this inside the Activity.
  int32 available_stock = 4;
}

message InventorySnapshot {
  string sku = 1;
  int32 requested_quantity = 2;
  int32 available_stock = 3;
  bool in_stock = 4;
}

message FulfillmentOutcome {
  string shipment_id = 1;
  string status = 2;
}

message BackorderOutcome {
  string backorder_id = 1;
  string status = 2;
  int32 shortfall = 3;
}

message ConditionalBranchResult {
  string order_id = 1;
  OrderPath path = 2;
  InventorySnapshot inventory = 3;
  FulfillmentOutcome fulfillment = 4;
  BackorderOutcome backorder = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp finished_at = 7;
  google.protobuf.Duration elapsed = 8;
}
